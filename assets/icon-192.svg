<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <!-- Círculos de Radar -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="#475569" stroke-width="2" opacity="0.7"/>
  <circle cx="96" cy="96" r="24" fill="none" stroke="#64748b" stroke-width="2" opacity="0.8"/>
  <!-- Linhas de Coordenadas -->
  <line x1="96" y1="20" x2="96" y2="172" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="96" x2="172" y2="96" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <!-- Feixe de Radar -->
  <path d="M 96 96 L 144 48 A 68 68 0 0 0 96 28 Z" fill="url(#accentGrad)" opacity="0.25" />
  <!-- Ícone de Balança Central (Preço vs Valor) -->
  <path d="M96 68 V118 M80 118 H112" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 82 L96 74 L120 82" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Prato Esquerdo (Preço) -->
  <line x1="72" y1="82" x2="64" y2="102" stroke="#f59e0b" stroke-width="2"/>
  <line x1="72" y1="82" x2="80" y2="102" stroke="#f59e0b" stroke-width="2"/>
  <path d="M60 102 C60 110 84 110 84 102 Z" fill="#f59e0b" opacity="0.9"/>
  <!-- Prato Direito (Valor mais pesado para baixo) -->
  <line x1="120" y1="82" x2="112" y2="108" stroke="#10b981" stroke-width="2"/>
  <line x1="120" y1="82" x2="128" y2="108" stroke="#10b981" stroke-width="2"/>
  <path d="M108 108 C108 116 132 116 132 108 Z" fill="#10b981" opacity="0.9"/>
  <!-- Ponto central e Badge "6" -->
  <circle cx="96" cy="96" r="5" fill="#38bdf8"/>
  <circle cx="152" cy="40" r="18" fill="#10b981" stroke="#020617" stroke-width="3"/>
  <text x="152" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">6</text>
</svg>
